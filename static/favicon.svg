<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Envelope body -->
  <rect x="152" y="332" width="720" height="460" rx="36" fill="white"/>

  <!-- Envelope flap — V fold -->
  <polygon points="152,332 512,556 872,332" fill="#bfdbfe"/>

  <!-- Bottom corner folds -->
  <polygon points="152,792 152,580 342,580" fill="#dbeafe"/>
  <polygon points="872,792 872,580 682,580" fill="#dbeafe"/>

  <!-- Text lines inside envelope -->
  <rect x="268" y="620" width="280" height="28" rx="14" fill="#93c5fd" opacity="0.5"/>
  <rect x="268" y="668" width="488" height="28" rx="14" fill="#93c5fd" opacity="0.35"/>
  <rect x="268" y="716" width="380" height="28" rx="14" fill="#93c5fd" opacity="0.35"/>
</svg>
