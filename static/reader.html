<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading…</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="container reader-header">
      <button class="btn-ghost" id="back-btn">← Back</button>
      <h1 id="header-title">Loading…</h1>
      <button class="mark-read-btn" id="mark-read-btn">Mark read</button>
    </div>
  </header>

  <main class="container" id="reader-root">
    <div class="reader-meta">
      <div class="reader-subject" id="subject"></div>
      <div class="reader-sender" id="sender"></div>
      <div class="reader-date" id="date"></div>
    </div>
    <div class="reader-frame-wrap" id="frame-wrap"></div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
