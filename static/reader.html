<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading…</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="container reader-header">
      <button class="btn-ghost" onclick="history.length > 1 ? history.back() : (location.href='/')">← Back</button>
      <h1 id="header-title">Loading…</h1>
      <button class="mark-read-btn" id="mark-read-btn">Mark read</button>
    </div>
  </header>

  <main class="container" id="reader-root">
    <div class="reader-meta">
      <div class="reader-subject" id="subject"></div>
      <div class="reader-sender" id="sender"></div>
      <div class="reader-date" id="date"></div>
    </div>
    <div class="reader-frame-wrap" id="frame-wrap"></div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
